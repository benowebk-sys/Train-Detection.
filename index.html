<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Detection & Equipment - Professional Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+Arabic:wght@400;700;900&family=Tajawal:wght@400;700;900&family=Rajdhani:wght@400;700;900&display=swap');

        :root {
            --bebo-green: #22c55e;
            --bebo-cyan: #00ffd5;
            --accent-red: #ef4444;
            --bebo-orange: #f97316;
            --bebo-purple: #a855f7;
            --glass-blur: blur(15px);
            --border-subtle: rgba(255,255,255,0.12);
            --bg-card: rgba(15, 23, 42, 0.75);
            --bg-surface: rgba(15, 23, 42, 0.55);
            --text-dim: #cbd5e1;
            --transition: all 0.4s ease;
        }

        body {
            font-family: 'Inter', 'Noto+Sans+Arabic', sans-serif;
            background-color: #020617;
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* --- Bebo Section (Updated Layout) --- */
        .bebo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1rem;
            position: relative;
        }

        @media (min-width: 768px) { .bebo-wrapper { align-items: flex-end; } }

        .bebo-bubble {
            background: rgba(25, 32, 48, 0.96);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-subtle);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #fff;
            margin-bottom: 6px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            max-width: 320px;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(8px);
            font-family: 'Tajawal', sans-serif;
            text-align: right;
            direction: rtl;
        }

        .bebo-bubble.active { opacity: 1; transform: translateY(0); }

        .bebo-robot {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #2a3445, #0d121a);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eyes-container { display: flex; gap: 8px; }
        .eye { width: 8px; height: 8px; background: var(--bebo-purple); border-radius: 50%; box-shadow: 0 0 8px var(--bebo-purple); }
        .bebo-robot.success .eye { background: var(--bebo-green); height: 4px; border-radius: 4px 4px 0 0; }
        .bebo-robot.error .eye { background: var(--accent-red); height: 3px; border-radius: 2px; transform: rotate(-15deg); }

        /* --- Quiz Body Styles --- */
        .card {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-subtle);
            padding: 1.2rem 1rem;
            border-radius: 16px;
            position: relative;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .q-ar-box {
            background: rgba(255, 62, 62, 0.03);
            border: 1px solid rgba(255, 62, 62, 0.08);
            border-left: 3px solid var(--accent-red);
            padding: 0.6rem 0.8rem;
            border-radius: 4px 10px 10px 4px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.85rem;
            color: var(--text-dim);
            direction: rtl;
            text-align: right;
            margin-top: 10px;
        }

        .q-en-main {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.35;
            color: #fff;
        }

        .options-grid {
            display: grid;
            gap: 8px;
            margin-bottom: 1.2rem;
        }

        .options-grid.two-cols { grid-template-columns: 1fr 1fr; }

        .option-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-dim);
            padding: 0.65rem 0.85rem;
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 10px;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn .char-idx {
            background: rgba(255, 255, 255, 0.08);
            color: var(--accent-red);
            width: 24px; height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
        }

        .option-btn:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            transform: translateX(4px);
        }

        .option-btn.correct { background: rgba(34, 197, 94, 0.15) !important; border-color: var(--bebo-green) !important; color: #fff !important; }
        .option-btn.wrong { background: rgba(255, 62, 62, 0.15) !important; border-color: var(--accent-red) !important; color: #fff !important; }

        .hint-display {
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s ease;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }

        .hint-display.active {
            max-height: 250px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border-left: 3px solid var(--accent-red);
        }

        footer {
            background: rgba(2, 2, 4, 0.98);
            padding: 3rem 1rem;
            text-align: center;
            color: #aaa;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            border-top: 1px solid #111;
            font-family: 'Rajdhani', sans-serif;
        }

        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .options-grid.two-cols { grid-template-columns: 1fr; }
            .card { padding: 1rem 0.85rem; }
            .q-en-main { font-size: 0.95rem; }
            .bebo-bubble { max-width: 280px; font-size: 0.75rem; }
        }

        @keyframes shimmer-bar { 0% { transform: translateX(100%); } 100% { transform: translateX(-300%); } }
        .shimmer-effect { animation: shimmer-bar 2.2s infinite linear; background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.15) 50%, transparent 100%); }
        .animate-text-shine { background-image: linear-gradient(90deg, #dc2626, #ffffff, #dc2626); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: text-shine 4s linear infinite; }
        
        #progress-bar { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="selection:bg-red-600 selection:text-white flex flex-col min-h-screen">

    <header class="relative bg-zinc-900 py-6 px-4 z-30 text-center">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-xl md:text-3xl font-black tracking-tight uppercase italic text-white">
                Train Detection <span class="text-red-600">&</span> Equipment
            </h1>
        </div>
        <div class="absolute bottom-0 left-0 w-full h-[3px] bg-red-600 shadow-[0_2px_15px_rgba(220,38,38,0.8)]"></div>
    </header>

    <div class="w-full bg-black/40 border-b border-white/5 py-4 px-4 sticky top-0 z-20 backdrop-blur-md">
        <div class="max-w-3xl mx-auto">
            <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden border border-white/10 p-[1px]">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-red-800 via-red-500 to-red-700 relative rounded-full" style="width: 0%;">
                    <div class="absolute inset-0 w-full h-full shimmer-effect"></div>
                </div>
            </div>
            <div class="mt-1.5 text-center">
                <span id="percentage-text" class="text-[9px] font-black text-red-500 uppercase tracking-[0.4em]">0% COMPLETE</span>
            </div>
        </div>
    </div>

    <main class="flex-grow flex flex-col items-center justify-center p-4 md:p-6 relative">
        <div id="bebo-wrapper" class="bebo-wrapper">
            <div id="bebo-robot" class="bebo-robot ready">
                <div class="eyes-container">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
            <div id="bebo-bubble" class="bebo-bubble"></div>
        </div>

        <div id="quiz-ui" class="w-full max-w-3xl z-10">
            <div class="mb-6 flex flex-col items-center">
                <button onclick="toggleHint()" class="flex items-center gap-2 px-6 py-2 bg-zinc-900 border border-white/10 rounded-lg text-slate-400 text-[10px] font-black uppercase tracking-widest hover:text-white transition-all">
                    <i data-lucide="lightbulb" class="w-3.5 h-3.5"></i>
                    <span>Hint / تلميح</span>
                </button>
                <div id="hint-panel" class="hint-display w-full max-w-xl mt-3 text-right">
                    <div class="bg-zinc-900 border-l-4 border-amber-500 p-3.5 rounded-lg text-slate-300 text-xs italic shadow-lg">
                        <span id="hint-text"></span>
                    </div>
                </div>
            </div>

            <div class="glass-card rounded-xl p-6 md:p-10 shadow-xl relative">
                <div class="mb-8">
                    <p class="text-red-600 font-black text-[9px] uppercase tracking-[0.4em] mb-4 border-l-2 border-red-600 pl-3 text-left text-white">QUESTION <span id="current-idx">01</span> / <span id="total-idx">00</span></p>
                    <div id="question-text"></div>
                </div>
                <div id="options-container" class="options-grid grid-cols-1 md:grid-cols-2 gap-3 mb-10 text-white"></div>
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-6 border-t border-white/5">
                    <button id="btn-prev" onclick="handleBack()" class="w-full sm:w-auto flex items-center justify-center gap-2 px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-lg font-black text-[10px] tracking-widest transition-all disabled:opacity-10 text-white">
                        <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i> BACK
                    </button>
                    <div class="flex items-center gap-3 w-full sm:w-auto">
                        <button id="btn-skip" onclick="handleSkip()" class="flex-1 sm:flex-none px-6 py-3 font-black text-slate-500 hover:text-white text-[10px] uppercase tracking-widest">
                            SKIP
                        </button>
                        <button id="next-btn" onclick="handleNext()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-8 py-3 bg-white text-black hover:bg-red-600 hover:text-white rounded-lg font-black text-[11px] uppercase tracking-widest shadow-lg disabled:opacity-20">
                            <span>NEXT</span> <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="result-view" class="hidden w-full max-w-2xl z-10">
            <div class="bg-zinc-900 border border-white/10 p-10 rounded-2xl shadow-xl text-center relative overflow-hidden">
                <div id="result-accent" class="absolute top-0 left-0 w-full h-[2px] shadow-[0_0_10px_rgba(34,197,94,1)]"></div>
                <h2 id="final-bebo-title" class="text-xl md:text-2xl font-black mb-8 text-white tracking-tight leading-relaxed" style="direction: rtl;"></h2>
                <div class="grid grid-cols-2 gap-4 mb-8 max-w-sm mx-auto mt-6">
                    <div class="bg-black/40 p-4 rounded-lg">
                        <p class="text-[8px] text-slate-500 font-bold uppercase mb-1">Score</p>
                        <p id="final-raw-score" class="text-2xl font-black text-white"></p>
                    </div>
                    <div class="bg-black/40 p-4 rounded-lg">
                        <p class="text-[8px] text-slate-500 font-bold uppercase mb-1">Accuracy</p>
                        <p id="final-pct" class="text-2xl font-black text-red-500"></p>
                    </div>
                </div>
                <div id="final-feedback" class="feedback-container mb-6"></div>
                <button onclick="location.reload()" class="px-8 py-3.5 bg-red-600 hover:bg-red-700 text-white font-black text-sm rounded-lg transition-all uppercase tracking-widest shadow-lg">Restart Session</button>
            </div>
        </div>
    </main>

    <footer class="bg-black py-12 px-4 border-t border-white/5 mt-auto text-center">
        <div class="max-w-7xl mx-auto">
            <p class="text-lg md:text-2xl font-bold tracking-tighter uppercase italic text-white/30">
                Developed by <span class="animate-text-shine font-black text-white">Bilal Mohamed</span>
            </p>
        </div>
    </footer>

    <script>
        const quizData = [
            { id: 1, type: "TF", question: "Track circuits operate on a fail-safe principle.", questionAr: "تعمل الدوائر القضبانية على مبدأ الأمان عند الفشل (Fail-safe).", options: ["True", "False"], correct: 0, hint: "Fail-safe means if it fails, it defaults to the safest state (Danger).", hintAr: "الأمان عند الفشل يعني أنه في حالة العطل، يعود النظام تلقائيًا إلى الحالة الأكثر أمانًا (وضع الخطر)." },
            { id: 2, type: "TF", question: "Axle counters depend on electrical continuity of rails.", questionAr: "تعتمد عدادات المحاور على الاستمرارية الكهربائية للقضبان.", options: ["True", "False"], correct: 1, hint: "Axle counters count wheels; they don't need rail continuity like track circuits.", hintAr: "عدادات المحاور تقوم بعد العجلات؛ وهي لا تحتاج لاستمرارية القضبان مثل الدوائر القضبانية." },
            { id: 3, type: "TF", question: "Broken rails cause a track circuit signal to turn red.", questionAr: "تؤدي القضبان المكسورة إلى تحول إشارة الدائرة القضبانية إلى اللون الأحمر.", options: ["True", "False"], correct: 0, hint: "A break in the rail interrupts the electrical path.", hintAr: "الكسر في القضيب يؤدي إلى قطع المسار الكهربائي." },
            { id: 4, type: "TF", question: "Axle counters automatically clear after a miscount.", questionAr: "يتم تصفير عدادات المحاور تلقائيًا بعد حدوث خطأ في العد.", options: ["True", "False"], correct: 1, hint: "A miscount usually requires a manual reset for safety reasons.", hintAr: "يتطلب خطأ العد عادةً إعادة ضبط يدوية لأسباب تتعلق بالسلامة." },
            { id: 5, type: "TF", question: "Wet ballast can cause false occupancy in track circuits.", questionAr: "يمكن أن تسبب فرشة الزلط (Ballast) المبللة إشغالًا كاذبًا في الدوائر القضبانية.", options: ["True", "False"], correct: 0, hint: "Moisture reduces the resistance between the rails.", hintAr: "الرطوبة تقلل المقاومة بين القضبان مما يسمح بمرور التيار." },
            { id: 6, type: "TF", question: "Sensor gapping is a critical parameter in axle counters.", questionAr: "تعد المسافة بين المستشعر والعجلة (Sensor gapping) معلمًا حيويًا في عدادات المحاور.", options: ["True", "False"], correct: 0, hint: "The distance between the wheel and the sensor must be precise.", hintAr: "يجب أن تكون المسافة بين العجلة والمستشعر دقيقة لضمان العد الصحيح." },
            { id: 7, type: "TF", question: "Track circuits are unaffected by rust on rails.", questionAr: "لا تتأثر الدوائر القضبانية بوجود الصدأ على القضبان.", options: ["True", "False"], correct: 1, hint: "Rust is an insulator and can prevent the wheels from shunting the circuit.", hintAr: "الصدأ يعتبر عازلًا ويمكن أن يمنع العجلات من توصيل (Shunt) الدائرة." },
            { id: 8, type: "TF", question: "Preventive maintenance reduces unexpected failures.", questionAr: "الصيانة الوقائية تقلل من الأعطال غير المتوقعة.", options: ["True", "False"], correct: 0, hint: "Fixing things before they break is the goal of preventive care.", hintAr: "الهدف من الرعاية الوقائية هو إصلاح الأشياء قبل تعطلها." },
            { id: 9, type: "TF", question: "EMI can affect axle counter performance.", questionAr: "يمكن أن يؤثر التداخل الكهرومغناطيسي (EMI) على أداء عداد المحاور.", options: ["True", "False"], correct: 0, hint: "Electromagnetic Interference can disrupt the sensors.", hintAr: "التداخل الكهرومغناطيسي قد يؤدي لتعطيل عمل المستشعرات." },
            { id: 10, type: "TF", question: "Corrective maintenance is performed before a fault occurs.", questionAr: "تتم الصيانة التصحيحية قبل وقوع العطل.", options: ["True", "False"], correct: 1, hint: "Corrective happens AFTER a fault; preventive happens BEFORE.", hintAr: "الصيانة التصحيحية تحدث بَعْد العطل، أما الوقائية فتحدث قَبْله." },
            { id: 11, type: "TF", question: "Train detection monitoring is essential for railway safety.", questionAr: "مراقبة نظام الكشف عن القطارات ضرورية لسلامة السكك الحديدية.", options: ["True", "False"], correct: 0, hint: "Knowing where the train is at all times is the foundation of safety.", hintAr: "معرفة مكان القطار في جميع الأوقات هو أساس السلامة." },
            { id: 12, type: "TF", question: "In an unoccupied track circuit, the relay is energized.", questionAr: "في الدائرة القضبانية غير المشغولة، يكون المرحل (Relay) في حالة تشغيل (Energized).", options: ["True", "False"], correct: 0, hint: "When no train is present, current flows to the relay.", hintAr: "عند عدم وجود قطار، يتدفق التيار إلى المرحل." },
            { id: 13, type: "TF", question: "Advanced analytics help predict track circuit failures early.", questionAr: "تساعد التحليلات المتقدمة في التنبؤ بأعطال الدوائر القضبانية مبكرًا.", options: ["True", "False"], correct: 0, hint: "Predictive data can spot degradation trends.", hintAr: "البيانات التنبؤية يمكنها رصد اتجاهات التدهور في الأداء." },
            { id: 14, type: "TF", question: "Zentrak monitoring increases the frequency of routine inspections.", questionAr: "تؤدي مراقبة زينتراك (Zentrak) إلى زيادة عدد مرات التفتيش الروتيني.", options: ["True", "False"], correct: 1, hint: "Remote monitoring actually aims to optimize and reduce physical inspection needs.", hintAr: "تهدف المراقبة عن بعد فعليًا إلى تحسين وتقليل الحاجة للتفتيش الميداني." },
            { id: 15, type: "TF", question: "Hall Effect sensors are used in AC track circuits.", questionAr: "تُستخدم مستشعرات تأثير هول (Hall Effect) في الدوائر القضبانية التي تعمل بالتيار المتردد (AC).", options: ["True", "False"], correct: 1, hint: "Hall Effect sensors are typically used in axle counters or current measurement.", hintAr: "تُستخدم مستشعرات تأثير هول عادةً في عدادات المحاور أو قياس التيار المستمر." },
            { id: 16, type: "TF", question: "DC traction current can interfere with AC track circuit measurements.", questionAr: "يمكن لتيار الجر المستمر (DC) أن يتداخل مع قياسات الدوائر القضبانية التي تعمل بالتيار المتردد (AC).", options: ["True", "False"], correct: 1, hint: "AC circuits are often chosen because they are less affected by DC traction.", hintAr: "غالبًا ما يتم اختيار دوائر التيار المتردد لأنها أقل تأثراً بتيارات الجر المستمرة." },
            { id: 17, type: "TF", question: "Audio frequency track circuits use diagnostic outputs for monitoring.", questionAr: "تستخدم الدوائر القضبانية ذات التردد الصوتي (Audio Frequency) مخارج تشخيصية للمراقبة.", options: ["True", "False"], correct: 0, hint: "Digital data outputs are standard for modern AF track circuits.", hintAr: "تعتبر مخارج البيانات الرقمية معيارًا في دوائر التردد الصوتي الحديثة." },
            { id: 18, type: "TF", question: "One logger can communicate with multiple receivers.", questionAr: "يمكن لجهاز تسجيل بيانات (Logger) واحد التواصل مع عدة مستقبلات.", options: ["True", "False"], correct: 0, hint: "Centralized logging often gathers data from multiple points.", hintAr: "التسجيل المركزي غالبًا ما يجمع البيانات من نقاط متعددة." },
            { id: 19, type: "TF", question: "Insulated rail joint contamination can affect track circuit performance.", questionAr: "تلوث فواصل القضبان المعزولة (Insulated Joints) يمكن أن يؤثر على أداء الدائرة القضبانية.", options: ["True", "False"], correct: 0, hint: "Dirt or metal filings can bridge the joint.", hintAr: "الأوساخ أو البرادة المعدنية يمكن أن تعمل كجسر عبر العازل." },
            { id: 20, type: "TF", question: "Train detection systems do not require maintenance.", questionAr: "أنظمة الكشف عن القطارات لا تتطلب صيانة.", options: ["True", "False"], correct: 1, hint: "Safety systems require high levels of rigorous maintenance.", hintAr: "تتطلب أنظمة السلامة مستويات عالية من الصيانة الصارمة." },
            { id: 21, type: "TF", question: "Mechanical signaling systems use physical rods and wires to operate signals.", questionAr: "تستخدم أنظمة الإشارات الميكانيكية قضبانًا وأسلاكًا ملموسة لتشغيل الإشارات.", options: ["True", "False"], correct: 0, hint: "Think of the old levers in a signal box.", hintAr: "فكر في الروافع (العتلات) القديمة في برج الإشارات." },
            { id: 22, type: "TF", question: "The home signal is the main stop signal in railway signaling.", questionAr: "إشارة الاستقبال (Home Signal) هي إشارة التوقف الرئيسية في نظام الإشارات.", options: ["True", "False"], correct: 0, hint: "It controls the entry to the station/block.", hintAr: "هي التي تتحكم في الدخول إلى المحطة أو قطاع السكة." },
            { id: 23, type: "TF", question: "Distant signals require trains to stop when they show danger.", questionAr: "تتطلب إشارة التحذير (Distant Signals) توقف القطارات عندما تظهر حالة الخطر.", options: ["True", "False"], correct: 1, hint: "Distant signals warn of the next signal; they don't command a stop themselves.", hintAr: "إشارات التحذير تحذر من حالة الإشارة التالية؛ ولا تأمر بالتوقف في مكانها." },
            { id: 24, type: "TF", question: "Junction signals are used when tracks divide into different routes.", questionAr: "تُستخدم إشارات التفريعة (Junction Signals) عندما تنقسم السكك إلى مسارات مختلفة.", options: ["True", "False"], correct: 0, hint: "They indicate which path the train will take.", hintAr: "توضح أي مسار سيسلكه القطار." },
            { id: 25, type: "TF", question: "Disc signals are mainly used for high-speed train operations.", questionAr: "تُستخدم الإشارات القرصية بشكل أساسي في عمليات القطارات عالية السرعة.", options: ["True", "False"], correct: 1, hint: "Disc signals are usually for slow shunting movements.", hintAr: "الإشارات القرصية تُستخدم عادةً لحركات المناورة البطيئة." },
            { id: 26, type: "TF", question: "Mechanical signaling systems depend heavily on electrical power.", questionAr: "تعتمد أنظمة الإشارات الميكانيكية بشكل كبير على الطاقة الكهربائية.", options: ["True", "False"], correct: 1, hint: "They are primarily mechanical, which is why they work during power cuts.", hintAr: "هي ميكانيكية بالأساس، ولهذا تعمل أثناء انقطاع الكهرباء." },
            { id: 27, type: "TF", question: "Mechanical signaling systems are suitable for lines with low train traffic.", questionAr: "تعد أنظمة الإشارات الميكانيكية مناسبة للخطوط ذات حركة القطارات المنخفضة.", options: ["True", "False"], correct: 0, hint: "They are simple and cost-effective for quiet lines.", hintAr: "هي بسيطة واقتصادية للخطوط الهادئة." },
            { id: 28, type: "TF", question: "One disadvantage of mechanical signaling is the high risk of human error.", questionAr: "من عيوب الإشارات الميكانيكية الارتفاع الكبير لخطر الخطأ البشري.", options: ["True", "False"], correct: 0, hint: "Operating levers manually depends on the signalman's attention.", hintAr: "تشغيل الروافع يدويًا يعتمد كليًا على انتباه عامل الإشارات." },
            { id: 29, type: "TF", question: "Mechanical signaling systems are easy to integrate with modern digital control systems.", questionAr: "من السهل دمج أنظمة الإشارات الميكانيكية مع أنظمة التحكم الرقمية الحديثة.", options: ["True", "False"], correct: 1, hint: "Converting iron rods to digital data is complex and costly.", hintAr: "تحويل القضبان الحديدية إلى بيانات رقمية أمر معقد ومكلف." },
            { id: 30, type: "TF", question: "Environmental conditions can affect the reliability of mechanical signaling systems.", questionAr: "يمكن للظروف البيئية أن تؤثر على موثوقية أنظمة الإشارات الميكانيكية.", options: ["True", "False"], correct: 0, hint: "Heat expansion or frost can affect long wire runs.", hintAr: "التمدد الحراري أو الصقيع يمكن أن يؤثر على الأسلاك الطويلة." },
            { id: 31, type: "MCQ", question: "Track circuits detect train presence by:", questionAr: "تقوم الدوائر القضبانية بالكشف عن وجود القطار من خلال:", options: ["Optical sensors", "Hydraulic pressure", "Electrical continuity through rails", "GPS positioning"], correct: 2, hint: "The wheelset creates a path between the two rails.", hintAr: "مجموعة العجلات تخلق مساراً (شورت) بين القضيبين." },
            { id: 32, type: "MCQ", question: "The main purpose of impedance bonds is to:", questionAr: "الغرض الرئيسي من روابط المعاوقة (Impedance Bonds) هو:", options: ["Increase ballast resistance", "Detect wheel flanges", "Isolate traction current from signaling current", "Count train axles"], correct: 2, hint: "They allow traction current to return while keeping signal current in its section.", hintAr: "تسمح لتيار الجر بالعودة مع الحفاظ على تيار الإشارات داخل قطاعه." },
            { id: 33, type: "MCQ", question: "In a track circuit, when a train enters the section, the relay becomes:", questionAr: "في الدائرة القضبانية، عندما يدخل القطار القطاع، يصبح المرحل (Relay):", options: ["Overloaded", "Energized", "Picked up", "De-energized"], correct: 3, hint: "The current is shunted away from the relay.", hintAr: "يتم تحويل التيار بعيدًا عن المرحل بواسطة عجلات القطار." },
            { id: 34, type: "MCQ", question: "Axle counters determine occupancy when:", questionAr: "تحدد عدادات المحاور إشغال السكة عندما:", options: ["Voltage drops below a limit", "Axles are detected magnetically", "Rails are electrically shunted", "Signals are manually set"], correct: 1, hint: "Sensors detect the metal of the wheel as it passes.", hintAr: "تكتشف المستشعرات معدن العجلة أثناء مرورها." },
            { id: 35, type: "MCQ", question: "A mismatch between in-count and out-count results in:", questionAr: "يؤدي عدم التطابق بين عدد المحاور الداخلة والخارجة إلى:", options: ["Clear track", "Green signal", "Occupied section", "Automatic reset"], correct: 2, hint: "If 10 axles enter but only 9 leave, the track is still occupied.", hintAr: "إذا دخل 10 محاور وخرج 9 فقط، تظل السكة مشغولة." },
            { id: 36, type: "MCQ", question: "Which condition causes false occupancy in track circuits?", questionAr: "أي من هذه الحالات تسبب إشغالًا كاذبًا في الدوائر القضبانية؟", options: ["High shunt resistance", "Wet ballast", "Sensor misalignment", "Power surge"], correct: 1, hint: "Water conducts current across the rails, simulating a train.", hintAr: "الماء يوصل التيار عبر القضبان، مما يحاكي وجود قطار." },
            { id: 37, type: "MCQ", question: "Axle counters are especially suitable for:", questionAr: "تعد عدادات المحاور مناسبة بشكل خاص لـ:", options: ["Short insulated sections only", "Dry ballast areas", "Tunnels and long track sections", "Manual signal systems"], correct: 2, hint: "They don't suffer from ballast leakage over long distances.", hintAr: "لا تعاني من مشكلة تسريب تيار الدائرة عبر الزلط في المسافات الطويلة." },
            { id: 38, type: "MCQ", question: "Sensor misalignment in axle counters leads to:", questionAr: "يؤدي عدم محاذاة المستشعر في عدادات المحاور إلى:", options: ["Increased accuracy", "False clear", "Missed counts", "Reduced EMI"], correct: 2, hint: "If the sensor isn't positioned right, it won't see the wheels.", hintAr: "إذا لم يتم وضع المستشعر بشكل صحيح، فلن يرصد العجلات." },
            { id: 39, type: "MCQ", question: "In both detection systems, a fault results in:", questionAr: "في كلا نظامي الكشف، يؤدي العطل إلى:", options: ["Green signal", "Yellow signal", "Signal off", "Red signal"], correct: 3, hint: "Safety systems fail to the most restrictive state.", hintAr: "أنظمة السلامة تعود لأكثر الحالات تقييداً (الخطر) عند العطل." },
            { id: 40, type: "MCQ", question: "Which maintenance action includes software updates?", questionAr: "أي إجراء صيانة يتضمن تحديثات البرامج؟", options: ["Routine maintenance", "Corrective maintenance", "Preventive maintenance", "Emergency operation"], correct: 2, hint: "Updates keep the system running optimally and prevent future bugs.", hintAr: "التحديثات تحافظ على عمل النظام بشكل مثالي وتمنع الأخطاء المستقبلية." },
            { id: 41, type: "MCQ", question: "What is the primary purpose of train detection systems?", questionAr: "ما هو الغرض الأساسي من أنظمة الكشف عن القطارات؟", options: ["Improve passenger comfort", "Detect track occupancy", "Reduce fuel consumption", "Control ticketing systems"], correct: 1, hint: "Knowing if a track is clear or full.", hintAr: "معرفة ما إذا كانت السكة خالية أم مشغولة." },
            { id: 42, type: "MCQ", question: "A track circuit is considered occupied when:", questionAr: "تعتبر الدائرة القضبانية مشغولة عندما:", options: ["The relay is energized", "Current flows freely through the rails", "Train wheels short-circuit the rails", "The signal lamp turns green"], correct: 2, hint: "Train wheels short-circuit the rails.", hintAr: "تقوم عجلات القطار بعمل دائرة قصر (شورت) بين القضبان." },
            { id: 43, type: "MCQ", question: "Which issue can be detected using advanced analytics?", questionAr: "أي مشكلة يمكن اكتشافها باستخدام التحليلات المتقدمة؟", options: ["Wheel wear", "Rail joint contamination", "Passenger overload", "Track alignment"], correct: 1, hint: "Electronic footprints of joints change over time.", hintAr: "البصمات الإلكترونية للفواصل تتغير بمرور الوقت." },
            { id: 44, type: "MCQ", question: "One benefit of Zentrak monitoring is:", questionAr: "إحدى فوائد مراقبة زينتراك (Zentrak) هي:", options: ["Increased manual inspection", "Reduced life-cycle cost", "Higher energy consumption", "Manual fault reporting"], correct: 1, hint: "Monitoring saves money over the lifespan of the equipment.", hintAr: "المراقبة توفر المال على مدى العمر التشغيلي للمعدات." },
            { id: 45, type: "MCQ", question: "AC track circuits commonly use which relay type?", questionAr: "ما نوع المرحل (Relay) الشائع في الدوائر القضبانية التي تعمل بالتيار المتردد (AC)؟", options: ["Thermal relay", "Solid-state relay", "Phase-sensitive vane relay", "Hydraulic relay"], correct: 2, hint: "The Vane relay is the classic choice for AC detection.", hintAr: "مرحل الفان (Vane relay) هو الخيار الكلاسيكي للكشف في أنظمة التيار المتردد." },
            { id: 46, type: "MCQ", question: "Which sensor is used to monitor DC track circuits?", questionAr: "أي مستشعر يُستخدم لمراقبة الدوائر القضبانية التي تعمل بالتيار المستمر (DC)؟", options: ["Optical sensor", "Temperature sensor", "Hall Effect sensor", "Pressure sensor"], correct: 2, hint: "Hall Effect sensors measure magnetic fields from DC current.", hintAr: "مستشعرات تأثير هول تقيس المجالات المغناطيسية الناتجة عن التيار المستمر." },
            { id: 47, type: "MCQ", question: "Audio frequency track circuits are mainly associated with:", questionAr: "ترتبط الدوائر القضبانية ذات التردد الصوتي بشكل أساسي بـ:", options: ["Mechanical signaling", "Manual block systems", "Microprocessor-controlled equipment", "Pneumatic systems"], correct: 2, hint: "Modern AF circuits are digital and computer-based.", hintAr: "دوائر التردد الصوتي الحديثة رقمية وتعتمد على الكمبيوتر." },
            { id: 48, type: "MCQ", question: "Which parameter is recorded in audio frequency monitoring?", questionAr: "أي معامل (Parameter) يتم تسجيله في مراقبة التردد الصوتي؟", options: ["Train speed", "Sideband current", "Axle load", "Rail temperature"], correct: 1, hint: "Frequency signals have sidebands that contain data.", hintAr: "إشارات التردد لها نطاقات جانبية (Sidebands) تحتوي على البيانات." },
            { id: 49, type: "MCQ", question: "Zentrak TDM can provide monitoring:", questionAr: "يمكن لنظام Zentrak TDM توفير المراقبة:", options: ["Only during daytime", "Only during maintenance", "24 hours a day", "Only when faults occur"], correct: 2, hint: "Remote monitoring is always active.", hintAr: "المراقبة عن بعد تعمل دائماً وبشكل مستمر." },
            { id: 50, type: "MCQ", question: "Track circuit monitoring data is mainly processed by:", questionAr: "يتم معالجة بيانات مراقبة الدوائر القضبانية بشكل أساسي بواسطة:", options: ["Signal lamps", "Mechanical relays", "Loggers and analytics software", "Train drivers"], correct: 2, hint: "Computers analyze the logs to find faults.", hintAr: "تقوم أجهزة الكمبيوتر بتحليل السجلات لاكتشاف الأعطال." },
            { id: 51, type: "MCQ", question: "Mechanical rail signaling mainly operates using:", questionAr: "تعمل إشارات السكك الحديدية الميكانيكية بشكل أساسي باستخدام:", options: ["Electronic circuits", "Hydraulic systems", "Physical levers and rods", "Wireless signals"], correct: 2, hint: "Mechanical force transmits the signal.", hintAr: "تنتقل الإشارة عن طريق القوة الميكانيكية." },
            { id: 52, type: "MCQ", question: "Which signal is considered the primary stop signal?", questionAr: "أي إشارة تعتبر إشارة التوقف الرئيسية؟", options: ["Distant Signal", "Home Signal", "Disc Signal", "Junction Signal"], correct: 1, hint: "The Home signal protects the main entrance to a station.", hintAr: "إشارة الاستقبال (Home Signal) تحمي المدخل الرئيسي للمحطة." },
            { id: 53, type: "MCQ", question: "Which signal warns the driver about the status of the next signal?", questionAr: "أي إشارة تحذر السائق من حالة الإشارة التالية؟", options: ["Home Signal", "Junction Signal", "Distant Signal", "Calling-on Signal"], correct: 2, hint: "It provides a 'distant' view of what's ahead.", hintAr: "توفر رؤية 'بعيدة' لما هو قادم." },
            { id: 54, type: "MCQ", question: "Junction signals are used when:", questionAr: "تُستخدم إشارات التفريعة (Junction Signals) عندما:", options: ["Trains enter stations", "Tracks split into different directions", "Trains leave yards", "Trains change speed"], correct: 1, hint: "They help route the train onto different tracks.", hintAr: "تساعد في توجيه القطار إلى مسارات مختلفة." },
            { id: 55, type: "MCQ", question: "Permissive signals allow a train to:", questionAr: "تسمح الإشارات السماحية (Permissive Signals) للقطار بـ:", options: ["Stop immediately", "Enter an occupied track slowly", "Increase speed", "Reverse direction"], correct: 1, hint: "It 'permits' entry under caution.", hintAr: "تسمح بالدخول تحت ظروف الحذر." },
            { id: 56, type: "MCQ", question: "Disc shunting signals are mainly used for:", questionAr: "تُستخدم إشارات المناورة القرصية (Disc Shunting) بشكل أساسي لـ:", options: ["High-speed operations", "Passenger stations", "Shunting movements in yards", "Long-distance travel"], correct: 2, hint: "Used for switching tracks in yards.", hintAr: "تُستخدم لتبديل السكك داخل الأحواش والمخازن." },
            { id: 57, type: "MCQ", question: "Which component is used to manually operate mechanical signals?", questionAr: "أي مكون يُستخدم لتشغيل الإشارات الميكانيكية يدوياً؟", options: ["Transformer", "Lever", "Battery", "Relay"], correct: 1, hint: "The signalman pulls this in the box.", hintAr: "يقوم عامل الإشارة بسحب هذا داخل برج الإشارات." },
            { id: 58, type: "MCQ", question: "One advantage of mechanical signaling systems is:", questionAr: "إحدى مزايا أنظمة الإشارات الميكانيكية هي:", options: ["High automation", "Low installation cost", "Wireless communication", "Computer control"], correct: 1, hint: "No complex electronics makes initial setup cheaper.", hintAr: "عدم وجود إلكترونيات معقدة يجعل التكلفة الأولية أرخص." },
            { id: 59, type: "MCQ", question: "Mechanical signaling systems are most suitable for:", questionAr: "تعد أنظمة الإشارات الميكانيكية أكثر ملاءمة لـ:", options: ["High-speed railways", "Busy urban railways", "Low traffic railway lines", "Metro systems"], correct: 2, hint: "They can't handle the high frequency of metros.", hintAr: "لا يمكنها التعامل مع التردد العالي لحركة المترو." },
            { id: 60, type: "MCQ", question: "A major limitation of mechanical signaling systems is:", questionAr: "من القيود الرئيسية لأنظمة الإشارات الميكانيكية:", options: ["Too much automation", "Dependence on electricity", "Limited operational range", "Digital complexity"], correct: 2, hint: "Rods and wires can only be so long before friction is too much.", hintAr: "القضبان والأسلاك لها مدى محدد قبل أن يصبح الاحتكاك كبيراً جداً." }
        ];

        let index = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const beboMessages = {
            intro: ["مرحبا اسمي بيبو جاهز لبدء الاختبار؟"],
            correct: [
                "عاش يا وحش! أداء أسطوري.", "الله ينور عليك، تركيزك في السما!", "ممتاز! كمل يا بطل بنفس الحماس.",
                "وحش! إجابة فنية مية مية.", "رائع، أنت فاهم اللعبة كويس جداً.", "برافو! إجابة أسطورية زي ما توقعت.",
                "عاش يا دحيح، مجهودك جبار.", "تسلم إيدك، إجابة مظبوطة بالملي.", "أحسنت! فخور بيك فعلاً يا وحش."
            ],
            wrong: [
                "غلط تماماً! ركز بقى عشان كدة كتير أوي!",
                "إيه العك ده؟ فوق كدة واقرأ السؤال كويس يا هندسة!",
                "إجابة كارثية! راجع معلوماتك فوراً كدة مينفعش!",
                "غلط! أنت بتهزر ولا إيه؟ ركز بقى شوية!"
            ],
             resultsAdvice: [
                "نتيجتك دى يسطا ولا درجه حراره.",
                "منت لو تبص على التلميحات وانت بتحل مكنتش جبت درجات الحراره دى.",
                "تعي اشب شاى يسطا بالى انت عامله ده.",
                "متزعلش مش مهم درجتك فى الامتحان المهم الصحه والستر.",
                "هيجى شخص يحسسك انك ف كفه والكون كله فى كفه وبعدين يسقفلك بالكفتين على وشك علشان النتيجه الى انت جايبها دى."
            ],
            resultsSuccess: [
                "ما شاء الله عليك ",
                "هايل بجد عاش عليك.",
                "شيء جميل جداً عندك أحسن من كده كمان عاش عليك."
            ]
        };

        function setBebo(state, category, specificIdx = -1) {
            const robot = document.getElementById('bebo-robot');
            const bubble = document.getElementById('bebo-bubble');
            let msgs = beboMessages[category];
            robot.className = `bebo-robot ${state}`;
            let chosenMsg = (category === 'correct' && specificIdx !== -1) ? (msgs[specificIdx % msgs.length]) : msgs[Math.floor(Math.random() * msgs.length)];
            bubble.innerText = chosenMsg;
            bubble.classList.add('active');
            setTimeout(() => { 
                bubble.classList.remove('active');
                if(index < quizData.length) robot.classList.remove('success', 'error');
            }, 3800);
        }

        function toggleHint() { document.getElementById('hint-panel').classList.toggle('active'); }

        function init() {
            document.getElementById('total-idx').innerText = quizData.length.toString().padStart(2, '0');
            render();
            setTimeout(() => setBebo('ready', 'intro'), 500);
        }

        function render() {
            const data = quizData[index];
            document.getElementById('current-idx').innerText = (index + 1).toString().padStart(2, '0');
            document.getElementById('total-idx').innerText = quizData.length.toString().padStart(2, '0');
            
            document.getElementById('question-text').innerHTML = `
                <div class="q-en-main">${data.question}</div>
                <div class="q-ar-box">${data.questionAr}</div>
            `;
            
            document.getElementById('hint-text').innerHTML = `
                <div style="margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; color: #fff;">Hint / تلميح</div>
                <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; font-family: 'Tajawal', sans-serif; text-align: right; direction: rtl; color: var(--text-dim); font-size: 0.85rem;">
                    <p style="margin-bottom: 5px;">${data.hint}</p>
                    <p style="color: rgba(255,255,255,0.5);">${data.hintAr}</p>
                </div>
            `;

            document.getElementById('hint-panel').classList.remove('active');

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            const answered = userAnswers[index] !== null;
            
            document.getElementById('next-btn').disabled = !answered;
            document.getElementById('next-btn').innerText = (index === quizData.length - 1) ? "FINALIZE" : "NEXT";
            document.getElementById('btn-prev').disabled = index === 0;
            
            const btnSkip = document.getElementById('btn-skip');
            if (answered) {
                btnSkip.classList.add('hidden');
            } else {
                btnSkip.classList.remove('hidden');
            }

            if (data.type === "MCQ") {
                container.className = "options-grid";
                data.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span class="char-idx">${String.fromCharCode(65 + i)}</span> <span>${opt}</span>`;
                    if (answered) {
                        btn.disabled = true;
                        if (i === data.correct) btn.classList.add('correct');
                        if (userAnswers[index] === i && i !== data.correct) btn.classList.add('wrong');
                    } else { btn.onclick = () => select(i); }
                    container.appendChild(btn);
                });
            } else {
                container.className = "options-grid two-cols";
                [1, 0].forEach(val => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.style.justifyContent = 'center';
                    btn.innerText = val === 1 ? "TRUE" : "FALSE";
                    if (answered) {
                        btn.disabled = true;
                        if (val === data.correct) btn.classList.add('correct');
                        if (userAnswers[index] === val && val !== data.correct) btn.classList.add('wrong');
                    } else { btn.onclick = () => select(val); }
                    container.appendChild(btn);
                });
            }
            document.getElementById('progress-bar').style.width = ((index + 1) / quizData.length * 100) + '%';
            document.getElementById('percentage-text').innerText = Math.round((index + 1) / quizData.length * 100) + '% COMPLETE';
        }

        function select(choice) {
            if (userAnswers[index] !== null) return;
            userAnswers[index] = choice;
            const correct = choice === quizData[index].correct;
            setBebo(correct ? 'success' : 'error', correct ? 'correct' : 'wrong', index);
            render();
        }

        function handleBack() { if (index > 0) { index -= 1; render(); } }
        function handleNext() { if (index === quizData.length - 1) { finish(); } else { index += 1; render(); } }
        function handleSkip() { if (index === quizData.length - 1) { finish(); } else { index += 1; render(); } }

        function finish() {
            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            document.querySelector('.bebo-wrapper').classList.add('hidden');
            const score = userAnswers.filter((a, i) => a === quizData[i].correct).length;
            const pct = Math.round(score / quizData.length * 100);
            document.getElementById('final-raw-score').innerText = `${score}/${quizData.length}`;
            document.getElementById('final-pct').innerText = pct + '%';
            const fb = document.getElementById('final-feedback');
            const category = pct >= 85 ? 'resultsSuccess' : 'resultsAdvice';
            fb.innerText = beboMessages[category][Math.floor(Math.random() * beboMessages[category].length)];
        }

        window.onload = () => {
            init();
            lucide.createIcons();
        };
    </script>
</body>
</html>
