<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Detection Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="page-shell">
        <div class="page-bg"></div>

        <header class="app-header">
            <h1>Train Detection</h1>
        </header>

        <main class="quiz-shell">
            <section class="quiz-frame glass-card">
                <div class="bebo-wrapper">
                    <div id="bebo-bubble" class="bebo-bubble">مرحبا اسمي بيبو</div>
                    <div id="bebo-robot" class="bebo-robot">
                        <div class="eyes-container">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                    </div>
                </div>

                <div id="quiz-ui" class="quiz-ui">
                    <div class="question-head">
                        <div class="question-meta">سؤال <span id="current-idx">01</span> / <span id="total-idx">50</span></div>
                        <div id="question-text" class="question-text"></div>
                    </div>

                    <div class="actions-row">
                        <div class="hint-group">
                            <button type="button" class="btn btn-outline" onclick="toggleHint()">تلميح</button>
                            <div id="hint-panel" class="hint-display">
                                <div id="hint-text" class="hint-text"></div>
                            </div>
                        </div>
                    </div>

                    <div id="options-container" class="options-grid"></div>

                    <div class="pager-row">
                        <button id="btn-prev" type="button" class="btn btn-secondary" onclick="handleBack()">BACK</button>
                        <button id="next-btn" type="button" class="btn btn-primary" onclick="handleNext()">NEXT</button>
                        <button type="button" id="btn-skip" class="btn btn-text" onclick="handleSkip()">Skip</button>
                    </div>
                </div>

                <div id="result-view" class="result-view hidden">
                    <div class="result-card">
                        <i data-lucide="award" class="result-icon"></i>
                        <h2 id="final-bebo-title">Your Result</h2>
                        <div class="result-grid">
                            <div class="result-box">
                                <span class="result-label">Score</span>
                                <span id="final-raw-score" class="result-value"></span>
                            </div>
                            <div class="result-box">
                                <span class="result-label">Percent</span>
                                <span id="final-pct" class="result-value"></span>
                            </div>
                        </div>
                        <p id="final-feedback" class="result-text"></p>
                        <button class="btn btn-primary" onclick="location.reload()">Restart Session</button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p class="footer-credit">By Developer Belal Mohamed</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
