<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Detection & Equipment - Professional Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+Arabic:wght@400;700;900&display=swap');

        :root {
            --bebo-green: #22c55e;
            --bebo-cyan: #00ffd5;
            --accent-red: #ef4444;
            --bebo-orange: #f97316;
        }

        body {
            font-family: 'Inter', 'Noto+Sans+Arabic', sans-serif;
            background-color: #020617;
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* --- Bebo Robot: Photo Exact Match --- */
        .bebo-wrapper {
            width: 100%;
            max-width: 48rem;
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            margin-bottom: -15px;
            position: relative;
            z-index: 40;
        }

        .bebo-robot {
            width: 70px;
            height: 70px;
            background: #111827; 
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .eyes-container { display: flex; gap: 12px; align-items: center; justify-content: center; }
        .eye { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
        
        /* State: Ready (Image 1) - Cyan Dots */
        .bebo-robot.ready { border-color: #00ffd566; }
        .bebo-robot.ready .eye {
            width: 11px;
            height: 11px;
            background: #00ffd5;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ffd5, 0 0 25px rgba(0, 255, 213, 0.3);
        }

        /* State: Success (Image 7) - Orange Arches Up */
        .bebo-robot.success { border-color: #f9731666; }
        .bebo-robot.success .eye {
            width: 16px;
            height: 10px;
            background: #f97316;
            border-radius: 40px 40px 0 0;
            box-shadow: 0 0 15px #f97316;
            margin-top: 5px;
        }

        /* State: Aggressive/Error (Image 4) - Red Slanted Sharp */
        .bebo-robot.aggressive, .bebo-robot.error { border-color: #ef444488; }
        .bebo-robot.aggressive .eye, .bebo-robot.error .eye {
            width: 20px;
            height: 7px;
            background: #ef4444;
            border-radius: 2px;
            box-shadow: 0 0 18px #ef4444, 0 0 5px #fff;
            transform: rotate(-30deg);
        }
        .bebo-robot.aggressive .eye:last-child, .bebo-robot.error .eye:last-child { transform: rotate(30deg); }

        .bebo-bubble {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 16px;
            border-radius: 14px;
            border-bottom-left-radius: 2px;
            margin-left: 15px;
            margin-bottom: 25px;
            max-width: 320px;
            font-size: 13px;
            font-weight: 800;
            color: #f1f5f9;
            opacity: 0;
            transform: scale(0.9) translateY(10px);
            transition: all 0.3s ease;
            direction: rtl;
        }

        .bebo-bubble.active { opacity: 1; transform: scale(1) translateY(0); }

        /* UI Animations */
        @keyframes shimmer-bar { 0% { transform: translateX(100%); } 100% { transform: translateX(-300%); } }
        .shimmer-effect { animation: shimmer-bar 2.2s infinite linear; background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.15) 50%, transparent 100%); }
        .animate-text-shine { background-image: linear-gradient(90deg, #dc2626, #ffffff, #dc2626); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: text-shine 4s linear infinite; }
        @keyframes text-shine { 0% { background-position: 100% 50%; } 100% { background-position: -100% 50%; } }

        .option-btn { transition: all 0.25s ease; text-align: left; }
        .option-btn.selected { background: rgba(220, 38, 38, 0.12); border-color: #dc2626; color: white; }
        .option-btn.correct-visual { border-color: #22c55e; background: rgba(34, 197, 94, 0.15); color: #86efac; }
        .option-btn.wrong-visual { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
        #progress-bar { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>

            </div>
        </div>
    </main>

            intro: ["نجم النجوم حمدلله على السلامه يعم .", "مرحبا اسمي بيبو جاهز لبدا الاختبار ؟.", "يا هلا يا هلا ", "خش كده ورينا هتعمل ايه .", "اهلا بالبطل اللى جاى يقلب الدنيا .", "جاهز يا للاختبار ."],
            correct: ["شخصين بحبهم انت والمصمم عاش عليك بجد يسطا .", "الدكتور مبسوطه منك هايل والله .", "لسانى يعجز عن الكلام والله بس حقيقى برافو .", "يسلام عيك عليك انت كده تلعب على الامتياز يانجم .", "هايل يباشا الله عليك عاش .", "ايوا كده عاوزك تفرتك الورقه فى الامتحان .", "يسلام عليك وانت ملعلع كده ايوا ستمر عاش .", "كده انت بتفهم مش بتهزر .", "اجابة تحترم بصراحة كمل على كده .", "واضح انك داخل تقفل مش تلعب .", "كده انت ماشى صح متغلطش بقى ."],
            aggressive: ["عارف الحيا هتحلو امتى لما تتنيل تذاكر .", "ركز يا مسطول .", "جلنف جلنف يعنى مفيش كلام.", "الموكوس وخايب الرجا لما يقعدو مع بعض .", "حسب خبرتى كده انت تلعب بالعجله درجن درجن الامتياز ده مش سكتك صدقنى.", "انت بتهزر يبنى اى ده انت كده مش هتحصل تجيب درجه حراره حتى.", "ادائك ده يدرس حقيقى اى الضحك ده يسطا.", "انت بتنام يسطا ولا متفوق يعم انت بتغرق كده.", "تعرف لو جابو ليا كنوز الدنيا علشان ابيعك هبيعك اى الى انت بتعملو ده.", "تقريبا الفص الى فى مخك المسؤل عن اتخاذ القرارات فص ثوم.", "انت كده داخل تضيع وقت مش اكتر .", "انا مش فاهم انت بتفكر ازاى اصلا .", "كده انت محتاج اعادة ضبط مصنع .", "لو ده مستواك يبقى فى مشكلة كبيرة ."],
            fast: ["خد نفسك واقرا السؤال الاول.", "هو حد بيجرى وراك ولا اى.", "مستعجل على يا اخويا اقرا السؤال الاول.", "اقرا السؤال الاول يا جلنف.", "اهدى كده مفيش سباق هنا .", "على مهلك شوية بدل الهبد ده ."],
            resultsAdvice: ["هيجى شخص يحسسك انك ف كفه والكون كله فى كفه وبعدين يسقفلك بالكفتين على وشك علشان النتيجه العره الى انت جايبها دى.", "متزعلش مش مهم درجتك فى الامتحان المهم الصحه والستر.", "تعي اشب شاى يسطا بالى انت عامله ده.", "منت لو تبص على التلميحات وانت بتحل مكنتش جبت درجات الحراره دى.", "نتيجتك دى يسطا ولا درجه حراره.", "بص النتيجه دى محتاجه شغل تقيل مش هزار .", "انت لازم تراجع من الاول خالص .", "لو كملت كده مش هتوصل لحاجه .", "شد حيلك بدل ما تفضل فى نفس المكان ."],
            resultsSuccess: ["اوعي تتغر بالنتيجه دى يا صحبي .", "المعيد القادم .", "مش قولتلك دحيح جامد يعم اتكل على الله يلا من هنا.", "نتيجه محترمه بس لسه قدامك احسن .", "كده انت فى السليم كمل بس .", "واضح انك تعبت وده باين فى نتيجتك ."]
        };

        let currentIdx = 0;
        let mistakes = 0;
        let answers = {};
        let lastActionTime = Date.now();

        function setBebo(state, category, isFinal = false) {
            const robot = document.getElementById('bebo-robot');
            const bubble = document.getElementById('bebo-bubble');
            const msgs = beboMessages[category];
            const chosenMsg = msgs[Math.floor(Math.random() * msgs.length)];
            
            robot.className = `bebo-robot ${state}`;

            if (isFinal) {
                bubble.classList.remove('active');
                document.getElementById('final-bebo-title').innerText = chosenMsg;
                const accent = document.getElementById('result-accent');
                if (state === 'success') {
                    accent.className = "absolute top-0 left-0 w-full h-[2px] bg-green-500 shadow-[0_0_10px_rgba(34,197,94,1)]";
                } else {
                    accent.className = "absolute top-0 left-0 w-full h-[2px] bg-red-600 shadow-[0_0_10px_rgba(220,38,38,1)]";
                }
            } else {
                bubble.innerText = chosenMsg;
                bubble.classList.add('active');
                // Removed the setTimeout so state stays until NEXT is pressed
            }
        }

        function resetBebo() {
            const robot = document.getElementById('bebo-robot');
            const bubble = document.getElementById('bebo-bubble');
            robot.className = "bebo-robot ready";
            bubble.classList.remove('active');
        }

        function updateProgress() {
            const correctCount = Object.keys(answers).filter(k => answers[k] === questionData[k].correct).length;
            const progress = Math.round((correctCount / questionData.length) * 100);
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('percentage-text').innerText = `${progress}% COMPLETE`;
        }

        function render() {
            const data = questionData[currentIdx];
            document.getElementById('q-idx-display').innerText = currentIdx + 1;
            document.getElementById('question-text').innerText = data.question;
            document.getElementById('hint-text').innerText = data.hint;
            document.getElementById('hint-box').classList.add('hidden');
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            data.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                let visualClass = '';
                if (answers[currentIdx] !== undefined) {
                    if (i === data.correct) visualClass = 'correct-visual';
                    else if (answers[currentIdx] === i) visualClass = 'wrong-visual';
                }
                btn.className = `option-btn flex items-center justify-between p-4 rounded-lg border border-white/5 bg-black/30 text-slate-400 font-bold ${answers[currentIdx] === i ? 'selected' : ''} ${visualClass}`;
                btn.innerHTML = `<span>${opt}</span><div class="w-5 h-5 rounded-full border border-white/10 flex items-center justify-center">${answers[currentIdx] === i ? '<i data-lucide="check" class="w-3 h-3 text-white"></i>' : ''}</div>`;
                btn.onclick = () => select(i);
                grid.appendChild(btn);
            });
            lucide.createIcons();
            
            document.getElementById('back-btn').disabled = currentIdx === 0;
            document.getElementById('next-btn').disabled = (answers[currentIdx] === undefined);
            lastActionTime = Date.now();
        }

        function select(i) {
            if (answers[currentIdx] !== undefined) return; // Prevent re-selecting on same question
            
            const elapsed = Date.now() - lastActionTime;
            const correct = i === questionData[currentIdx].correct;
            answers[currentIdx] = i;

            if (correct) {
                mistakes = 0;
                if (elapsed < 2000) setBebo('aggressive', 'fast');
                else setBebo('success', 'correct');
            } else {
                mistakes++;
                setBebo('aggressive', 'aggressive');
            }
            updateProgress();
            render();
        }

        function handleNext() {
            if (currentIdx < questionData.length - 1) {
                currentIdx++;
                resetBebo(); // Return Bebo to ready for new question
                render();
            } else finish();
        }

        function handleBack() {
            if (currentIdx > 0) {
                currentIdx--;
                resetBebo();
                render();
            }
        }

        function handleSkip() { handleNext(); }
        function toggleHint() { document.getElementById('hint-box').classList.toggle('hidden'); }

        function finish() {
            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('bebo-wrapper').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            
            const correctCount = Object.keys(answers).filter(k => answers[k] === questionData[k].correct).length;
            const pct = Math.round((correctCount / questionData.length) * 100);
            document.getElementById('final-pct').innerText = pct + '%';
            document.getElementById('final-raw-score').innerText = `${correctCount} / ${questionData.length}`;
            
            if (pct >= 80) {
                setBebo('success', 'resultsSuccess', true);
            } else {
                setBebo('aggressive', 'resultsAdvice', true);
            }
        }

        window.onload = () => {
            render();
            lucide.createIcons();
            setBebo('ready', 'intro');
        };
    </script>
</body>
</html>
